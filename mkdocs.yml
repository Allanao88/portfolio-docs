site_name: Allan | Data Engineering & DBA Portfolio
site_url: https://Allanao88.github.io/portfolio-docs/
site_description: Portfólio Técnico de Engenharia de Dados e DBA

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Allanao88
      name: Allan no GitHub
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/seu-perfil  # <-- Substitua pelo seu LinkedIn
      name: Allan no LinkedIn

nav:
  - Início: index.md
  - Projetos:
    - Portal de Monitorização DBA: projetos/portal-monitorizacao.md
