<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Fundo transparente -->
  <rect width="200" height="200" fill="transparent"/>
  
  <!-- Cubo Isométrico / Hexágono (Infraestrutura / Bancos de Dados) -->
  <polygon points="100,20 170,60 170,140 100,180 30,140 30,60" fill="none" stroke="#06b6d4" stroke-width="12" stroke-linejoin="round" />
  
  <!-- Linhas de conexão internas (Pipelines / ETL) -->
  <polyline points="100,20 100,100 170,60" fill="none" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="100" y1="100" x2="30" y2="60" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" />
  <line x1="100" y1="100" x2="100" y2="180" stroke="#06b6d4" stroke-width="12" stroke-linecap="round" />
  
  <!-- Nodo Central (Convergência de dados) -->
  <circle cx="100" cy="100" r="16" fill="#0f172a" stroke="#06b6d4" stroke-width="8" />
  
  <!-- Nodos periféricos (APIs, Fontes de Dados) -->
  <circle cx="100" cy="20" r="8" fill="#06b6d4" />
  <circle cx="170" cy="60" r="8" fill="#06b6d4" />
  <circle cx="170" cy="140" r="8" fill="#06b6d4" />
  <circle cx="100" cy="180" r="8" fill="#06b6d4" />
  <circle cx="30" cy="140" r="8" fill="#06b6d4" />
  <circle cx="30" cy="60" r="8" fill="#06b6d4" />
</svg>
